<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tameru">
  <defs>
    <linearGradient id="tameru-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B46F1"/>
      <stop offset="100%" stop-color="#5558F0"/>
    </linearGradient>
  </defs>
  <!-- Modern Cobalt/Indigo Squircle Container -->
  <rect width="40" height="40" rx="11" fill="url(#tameru-grad)"/>

  <!-- Protective Planning Canopy (Top bar of 'T' representing Budget & Financial Security) -->
