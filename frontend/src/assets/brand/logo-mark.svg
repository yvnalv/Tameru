  <!-- Ascending Savings / Accumulation Pillars -->
  <!-- Left: Foundation / Regular Savings -->
  <rect x="9.5" y="23" width="5" height="8" rx="2.5" fill="#FFFFFF" opacity="0.75"/>
  <!-- Center: Central 'T' Pillar / Long-term Financial Discipline -->
  <rect x="17.5" y="13.5" width="5" height="17.5" rx="2.5" fill="#FFFFFF"/>
  <!-- Right: Wealth Target / Growth Momentum -->
  <rect x="25.5" y="17" width="5" height="14" rx="2.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
