name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .NET 8 SDK provides the net8.0 runtime (the app targets net8.0); .NET 9 SDK is needed to
      # build the .slnx solution file.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore Tameru.slnx

      - name: Build
        run: dotnet build Tameru.slnx --configuration Release --no-restore

      # Runs unit + architecture + integration tests. Integration tests use Testcontainers, which
      # needs Docker — available on the GitHub-hosted ubuntu runner.
      - name: Test
        run: dotnet test Tameru.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (vue-tsc typecheck + vite build)
        run: npm run build

      - name: Test
        run: npm run test
